<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Doctor Serial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111;padding:12px;color:#fff}
.top{background:linear-gradient(135deg,#00b4d8,#00c853);color:#fff;text-align:center;padding:14px;border-radius:14px}
.box{background:#fff;color:#000;border-radius:14px;padding:14px;margin-top:12px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-bottom:8px;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:9px;font-weight:bold;font-size:15px;margin-top:4px}
.drow{background:#f5f5f5;padding:10px;border-radius:10px;margin-top:8px;display:flex;gap:10px;align-items:center}
.drow img{width:50px;height:50px;border-radius:50%;object-fit:cover}
</style></head>
<body>
<div class="top"><h2>🔐 Admin Panel</h2><p>Doctor Serial - শুধু তোমার জন্য</p></div>
<div class="box" id="loginBox"><h3>🔑 পাসওয়ার্ড দাও ভাই</h3><input id="pw" type="password" placeholder="পাসওয়ার্ড - 1234"><button style="background:#000;color:#fff" onclick="if(document.getElementById('pw').value=='1234'){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';loadD()}else{alert('ভুল পাসওয়ার্ড ভাই!')}">লগইন</button></div>
<div class="box" id="mainBox" style="display:none"><h3>➕ নতুন ডাক্তার যোগ করো</h3><input id="a1" placeholder="ডাক্তারের নাম - Dr. ..."><input id="a2" placeholder="হাসপাতাল - MID POINT HOSPITAL"><input id="a3" placeholder="রুম - রুম ২০১"><input id="a4" placeholder="ফি - 100 টাকা"><input id="a5" placeholder="ছবির লিংক - দিলে ঐ ছবি আসবে"><input id="a7" placeholder="LIVE সিরিয়াল নং - 5"><select id="a6"><option value="medicine">💊 মেডিসিন</option><option value="neurology">🧠 Neurology</option></select><button style="background:#00c853;color:#fff" onclick="var n=document.getElementById('a1').value,h=document.getElementById('a2').value,r=document.getElementById('a3').value,f=document.getElementById('a4').value,p=document.getElementById('a5').value||'https://randomuser.me/api/portraits/men/32.jpg',s=document.getElementById('a7').value||'1',c=document.getElementById('a6').value;if(!n||!h){alert('নাম আর হাসপাতাল দাও ভাই!')}else{var d=JSON.parse(localStorage.getItem('docs')||'[]');d.push({n:n,h:h,r:r,f:f,s:s,c:c,p:p});localStorage.setItem('docs',JSON.stringify(d));alert('হইছে ভাই!');loadD();document.getElementById('a1').value='';document.getElementById('a2').value='';document.getElementById('a3').value='';document.getElementById('a4').value='';document.getElementById('a5').value='';document.getElementById('a7').value='';}">✅ ডাক্তার যোগ করো</button><h3 style="margin-top:16px">👨‍⚕️ ডাক্তার লিস্ট - <span id="cnt">0</span> জন</h3><div id="list"></div><button style="background:#ff3b30;color:#fff" onclick="if(confirm('সব ডিলিট করবা ভাই?')){localStorage.removeItem('docs');loadD()}">🗑️ সব ডিলিট</button></div>
<script>function loadD(){var d=JSON.parse(localStorage.getItem('docs')||'[]');document.getElementById('cnt').innerText=d.length;var L=document.getElementById('list');L.innerHTML='';d.forEach(function(x,i){L.innerHTML+='<div class=drow><img src="'+(x.p||'https://randomuser.me/api/portraits/men/32.jpg')+'"><div style=flex:1><b>'+x.n+'</b><br><span style=font-size:12px>'+x.h+' | '+x.r+' | '+x.f+'</span></div><button style=width:auto;padding:8px 12px;background:#ff3b30;color:#fff onclick=delD('+i+')>ডিলিট</button></div>'})}function delD(i){var d=JSON.parse(localStorage.getItem('docs')||'[]');d.splice(i,1);localStorage.setItem('docs',JSON.stringify(d));loadD()}</script>
</body></html>
