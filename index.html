<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Serial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#eef4ff;padding:10px}
.top{background:linear-gradient(135deg,#00b4d8,#00c853);color:#fff;text-align:center;padding:16px 10px;border-radius:16px}
.top h1{font-size:42px;margin:8px 0 2px;line-height:1}.top h1 b{color:#ffe600}
.live{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;margin:10px 0;font-size:14px;font-weight:bold}
.live b{color:#ffcc00}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.toprow{display:flex;gap:12px;align-items:center}
.toprow img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #00c853;flex-shrink:0}
.toprow h2{font-size:19px;line-height:1.3}
.btn{width:100%;padding:14px;border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;margin-top:8px}
.wa{background:#25D366}.sm{background:#0077cc}
.pop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:15px}
.pb{background:#fff;width:100%;max-width:360px;border-radius:14px;padding:16px;text-align:center}
.pb input{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-bottom:8px;font-size:15px}
.pb button{width:100%;padding:12px;border:none;border-radius:9px;font-weight:bold;margin-top:4px}
</style></head>
<body>

<div class="top">
<span style="background:#fff;color:#008000;font-size:13px;padding:5px 14px;border-radius:20px;font-weight:bold;display:inline-block">✦ ১ মিনিটে সিরিয়াল • ঘরে বসেই ✦</span>
<h1>Doctor <b>Serial</b></h1>
<p style="font-size:15px;line-height:1.5;font-weight:bold">লাইনে দাঁড়ানো ছাড়াই পছন্দের ডাক্তারের সিরিয়াল নিন<br>WhatsApp ও SMS এ সাথে সাথে কনফার্ম</p>
</div>

<div class="live"><span>🔴 LIVE - এখন সিরিয়াল চলছে</span><span>মোট: <b id="cnt">2 জন ডাক্তার</b></span></div>

<div style="background:#fff;border-radius:12px;padding:8px;margin-bottom:10px">
<select id="h" onchange="filt()" style="width:100%;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:15px;color:#fff;background:#000;margin-top:4px">
<option value="all">🏥 সব হাসপাতাল ▼</option>
<option value="MID POINT HOSPITAL">🏥 MID POINT HOSPITAL</option>
<option value="CHITTAGONG MEDICAL">🏥 CHITTAGONG MEDICAL</option>
</select>
<select id="c" onchange="filt()" style="width:100%;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:15px;color:#fff;background:#0096e8;margin-top:8px">
<option value="all">📂 সব বিভাগ ▼</option>
<option value="medicine">💊 মেডিসিন</option>
<option value="neurology">🧠 Neurology - নার্ভ</option>
</select>
</div>

<div id="list"></div>
<p id="empty" style="display:none;text-align:center;background:#fff;padding:16px;border-radius:12px;font-weight:bold">এই হাসপাতাল / বিভাগে ডাক্তার নাই ভাই</p>

<div id="bp" class="pop"><div class="pb"><h3 id="bt">সিরিয়াল বুক করুন</h3><p id="br"></p>
<input id="n1" placeholder="রোগীর নাম *"><input id="n2" placeholder="মোবাইল *"><input id="n3" placeholder="বয়স *"><input id="n4" placeholder="রোগের নাম *">
<button style="background:#00c853;color:#fff" onclick="var a=document.getElementById('n1').value,b=document.getElementById('n2').value,c=document.getElementById('n3').value,d=document.getElementById('n4').value;if(!a||!b||!c||!d){alert('৪টা ঘরই পূরণ করো ভাই!')}else{var m='Doctor Serial\nডাক্তার: '+window.CD+'\nনাম: '+a+'\nমোবাইল: '+b+'\nবয়স: '+c+'\nরোগ: '+d+'\nরুম: '+window.CR;document.getElementById('od').innerText=m;document.getElementById('ok').style.display='block';var L=document.getElementById('sl');if(window.BT=='whatsapp'){L.href='https://wa.me/8801812345678?text='+encodeURIComponent(m);L.innerText='WhatsApp এ পাঠান';L.style.background='#25D366';}else{L.href='sms:+8801812345678?body='+encodeURIComponent(m);L.innerText='SMS এ পাঠান';L.style.background='#0077cc';}}">✅ কনফার্ম করুন</button>
<button onclick="document.getElementById('bp').style.display='none'">বন্ধ</button>
<div id="ok" style="display:none;background:#d4edda;padding:12px;border-radius:10px;margin-top:10px"><b>✅ সিরিয়াল কনফার্ম!</b><p id="od"></p><a id="sl" href="#" target="_blank" style="display:block;background:#25D366;color:#fff;padding:11px;border-radius:9px;text-decoration:none;font-weight:bold;margin-top:8px">পাঠান</a></div>
</div></div>
<p style="text-align:center;font-size:12px;color:#888;padding:10px">Doctor Serial © 2026</p>

<script>
var DEF=[{n:'Dr. Somaiya Hassan',h:'MID POINT HOSPITAL',r:'রুম ২০১',f:'100 টাকা',c:'medicine',s:'5',p:'https://randomuser.me/api/portraits/women/44.jpg'},{n:'Dr. Neurology ডাক্তার',h:'CHITTAGONG MEDICAL',r:'রুম ৩০২',f:'500 টাকা',c:'neurology',s:'3',p:'https://randomuser.me/api/portraits/men/32.jpg'}];
function getD(){var d=JSON.parse(localStorage.getItem('docs')||'null');if(!d){localStorage.setItem('docs',JSON.stringify(DEF));return DEF}return d}
function filt(){var hv=document.getElementById('h').value,cv=document.getElementById('c').value;var d=getD();var f=d.filter(function(x){return (hv=='all'||x.h==hv)&&(cv=='all'||x.c==cv)});document.getElementById('cnt').innerText=f.length+' জন ডাক্তার';var L=document.getElementById('list');L.innerHTML='';document.getElementById('empty').style.display=f.length?'none':'block';f.forEach(function(x){L.innerHTML+='<div class=card><div class=toprow><img src="'+(x.p||'https://randomuser.me/api/portraits/men/32.jpg')+'"><div><h2>'+x.n+'</h2><p style=font-size:13px;color:#666>MBBS • বিশেষজ্ঞ</p></div></div><p style=margin-top:8px>📍 '+x.h+' | 🚪 '+x.r+' | '+x.f+'</p><p>🔴 LIVE সিরিয়াল '+x.s+' নং</p><button class=btn wa onclick="openB(\'whatsapp\',\''+x.n+'\',\''+x.r+'\')">WhatsApp এ সিরিয়াল নিন</button><button class=btn sm onclick="openB(\'sms\',\''+x.n+'\',\''+x.r+'\')">SMS এ সিরিয়াল নিন</button></div>'})}
function openB(t,n,r){document.getElementById('bt').innerText=(t=='whatsapp'?'WhatsApp - ':'SMS - ')+n;document.getElementById('br').innerText='🚪 '+r;document.getElementById('bp').style.display='flex';document.getElementById('ok').style.display='none';window.BT=t;window.CD=n;window.CR=r}
filt();
</script>
</body></html>
