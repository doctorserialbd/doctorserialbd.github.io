<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - Doctor Serial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111;padding:12px;color:#fff}
.top{background:#00b44d;color:#fff;text-align:center;padding:14px;border-radius:14px}
.box{background:#fff;color:#000;border-radius:14px;padding:14px;margin-top:12px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-bottom:8px;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:9px;font-weight:bold;font-size:15px;margin-top:4px}
.hrow{background:#f5f5f5;padding:10px;border-radius:10px;margin-top:8px}
</style></head>
<body>
<div class="top"><h2>👑 Admin Panel</h2><p>শুধু এডমিনের জন্য</p><p style="font-size:12px;margin-top:4px"><a href="index.html" style="color:#fff">← সাইটে ফিরে যান</a></p></div>
<div class="box" id="loginBox"><h3>🔑 এডমিন পাসওয়ার্ড</h3><input id="pw" type="password" placeholder="🔑 পাসওয়ার্ড"><button style="background:#000;color:#fff" onclick="if(document.getElementById('pw').value=='ain@4088'){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';loadH();loadD()}else{alert('ভুল পাসওয়ার্ড!')}">লগইন</button></div>
<div class="box" id="mainBox" style="display:none">
<h3 id="formTitle">➕ নতুন হাসপাতাল যোগ করুন</h3>
<input id="h1" placeholder="🏥 হাসপাতালের নাম">
<input id="h2" placeholder="👤 ইউজার">
<input id="h3" placeholder="🔑 পাসওয়ার্ড">
<input id="h4" placeholder="📞 হাসপাতালের নাম্বার">
<button id="saveBtn" style="background:#00a63d;color:#fff" onclick="saveH()">✅ হাসপাতাল তৈরি করুন</button>
<button id="cancelBtn" style="background:#eeeeee;color:#000;display:none" onclick="cancelEdit()">বাতিল</button>
<h3 style="margin-top:16px">🏥 হাসপাতাল লিস্ট - এডিট করতে পারবেন</h3>
<div id="list"></div>
<h3 style="margin-top:16px">🩺 সব ডাক্তার লিস্ট - এডমিন এডিট করতে পারবে</h3>
<p style="font-size:12px;color:#666">যেকোনো ডাক্তারের এডিটে চাপ দিলে নিচে ফর্ম আসবে - নাম, ফি, সময়, LIVE সব বদলানো যাবে</p>
<div id="docList"></div>
<div id="docEditBox" style="display:none;background:#eef4ff;padding:12px;border-radius:10px;margin-top:12px">
<h3 id="docEditTitle">✏️ ডাক্তার এডিট</h3>
<input id="e1" placeholder="ডাক্তারের নাম">
<input id="e2" placeholder="🎓 ডিগ্রী">
<input id="e3" placeholder="রুম">
<input id="e4" placeholder="ফি">
<input id="e5" placeholder="🕐 কয়টা থেকে কয়টা">
<input id="e6" placeholder="📂 বিভাগ">
<input id="e7" placeholder="🔴 LIVE সিরিয়াল">
<button style="background:#0066cc;color:#fff" onclick="saveDocEdit()">💾 ডাক্তার আপডেট করুন</button>
<button style="background:#eeeeee;color:#000" onclick="document.getElementById('docEditBox').style.display='none'">বাতিল</button>
</div>
</div>
<script>
var editIdx=-1;var editDocIdx=-1;
function loadH(){var hs=JSON.parse(localStorage.getItem('hospitals')||'[]');if(!hs.length){hs=[{id:'midpoint',pw:'1234',name:'MID POINT HOSPITAL',phone:'01888404288'},{id:'cmc',pw:'1234',name:'CHITTAGONG MEDICAL',phone:'01888404288'}];localStorage.setItem('hospitals',JSON.stringify(hs))}var L=document.getElementById('list');L.innerHTML='';hs.forEach(function(x,i){var ph=x.phone||'01888404288';L.innerHTML+='<div class=hrow><b>'+x.name+'</b><br><span style=font-size:13px>ইউজার: <b>'+x.id+'</b> | পাসওয়ার্ড: <b>'+x.pw+'</b><br>📞 নাম্বার: <b>'+ph+'</b></span><br><div style=display:flex;gap:6px;margin-top:6px><button style=width:auto;padding:8px 14px;background:#0066cc;color:#fff;margin-top:0;flex:1 onclick=editH('+i+')>✏️ এডিট</button><button style=width:auto;padding:8px 14px;background:#ff3b30;color:#fff;margin-top:0;flex:1 onclick=delH('+i+')>🗑️ ডিলিট</button></div></div>'})}
function editH(i){var hs=JSON.parse(localStorage.getItem('hospitals')||'[]');var x=hs[i];editIdx=i;document.getElementById('h1').value=x.name;document.getElementById('h2').value=x.id;document.getElementById('h3').value=x.pw;document.getElementById('h4').value=x.phone||'01888404288';document.getElementById('formTitle').innerText='✏️ এডিট করছেন - '+x.name;document.getElementById('saveBtn').innerText='💾 আপডেট করুন';document.getElementById('saveBtn').style.background='#0066cc';document.getElementById('cancelBtn').style.display='block';window.scrollTo(0,0)}
function cancelEdit(){editIdx=-1;document.getElementById('h1').value='';document.getElementById('h2').value='';document.getElementById('h3').value='';document.getElementById('h4').value='';document.getElementById('formTitle').innerText='➕ নতুন হাসপাতাল যোগ করুন';document.getElementById('saveBtn').innerText='✅ হাসপাতাল তৈরি করুন';document.getElementById('saveBtn').style.background='#00a63d';document.getElementById('cancelBtn').style.display='none'}
function saveH(){var n=document.getElementById('h1').value,h=document.getElementById('h2').value,p=document.getElementById('h3').value,ph=document.getElementById('h4').value;if(!n||!h||!p||!ph){alert('সব ঘর পূরণ করুন!');return}var hs=JSON.parse(localStorage.getItem('hospitals')||'[]');if(editIdx>=0){hs[editIdx]={id:h,pw:p,name:n,phone:ph};localStorage.setItem('hospitals',JSON.stringify(hs));alert('হইছে! আপডেট হইছে');cancelEdit();loadH()}else{if(hs.find(function(x){return x.id==h})){alert('এই ইউজার আগেই আছে!');return}hs.push({id:h,pw:p,name:n,phone:ph});localStorage.setItem('hospitals',JSON.stringify(hs));alert('হইছে! হাসপাতালকে দিন - ইউজার: '+h+' পাসওয়ার্ড: '+p+' নাম্বার: '+ph);document.getElementById('h1').value='';document.getElementById('h2').value='';document.getElementById('h3').value='';document.getElementById('h4').value='';loadH()}}
function delH(i){if(!confirm('ডিলিট করবো?'))return;var hs=JSON.parse(localStorage.getItem('hospitals')||'[]');hs.splice(i,1);localStorage.setItem('hospitals',JSON.stringify(hs));loadH()}
function loadD(){var d=JSON.parse(localStorage.getItem('docs')||'[]');var L=document.getElementById('docList');L.innerHTML='';if(!d.length)L.innerHTML='<p style=font-size:13px>এখনো ডাক্তার নাই</p>';d.forEach(function(x,i){L.innerHTML+='<div class=hrow><b>'+x.n+'</b> <span style=font-size:12px>('+x.h+')</span><br><span style=font-size:13px>'+(x.deg||'')+' | '+(x.c||'')+' | 🕐 '+(x.time||'')+' | 💰 '+(x.f||'')+' | 🔴 LIVE '+(x.s||'')+'</span><br><div style=display:flex;gap:6px;margin-top:6px><button style=width:auto;padding:8px 14px;background:#0066cc;color:#fff;margin-top:0;flex:1 onclick=editDoc('+i+')>✏️ এডিট</button><button style=width:auto;padding:8px 14px;background:#ff3b30;color:#fff;margin-top:0;flex:1 onclick=delDoc('+i+')>🗑️ ডিলিট</button></div></div>'})}
function editDoc(i){var d=JSON.parse(localStorage.getItem('docs')||'[]');var x=d[i];editDocIdx=i;document.getElementById('docEditBox').style.display='block';document.getElementById('docEditTitle').innerText='✏️ এডিট - '+x.n+' ('+x.h+')';document.getElementById('e1').value=x.n||'';document.getElementById('e2').value=x.deg||'';document.getElementById('e3').value=x.r||'';document.getElementById('e4').value=x.f||'';document.getElementById('e5').value=x.time||'';document.getElementById('e6').value=x.c||'';document.getElementById('e7').value=x.s||'';window.scrollTo(0,document.body.scrollHeight)}
function saveDocEdit(){var d=JSON.parse(localStorage.getItem('docs')||'[]');if(editDocIdx<0)return;d[editDocIdx].n=document.getElementById('e1').value;d[editDocIdx].deg=document.getElementById('e2').value;d[editDocIdx].r=document.getElementById('e3').value;d[editDocIdx].f=document.getElementById('e4').value;d[editDocIdx].time=document.getElementById('e5').value;d[editDocIdx].c=document.getElementById('e6').value;d[editDocIdx].s=document.getElementById('e7').value;localStorage.setItem('docs',JSON.stringify(d));alert('হইছে! ডাক্তার আপডেট হইছে');document.getElementById('docEditBox').style.display='none';loadD()}
function delDoc(i){if(!confirm('ডাক্তার ডিলিট করবো?'))return;var d=JSON.parse(localStorage.getItem('docs')||'[]');d.splice(i,1);localStorage.setItem('docs',JSON.stringify(d));loadD()}
</script>
</body></html>
