<title>Doctor Serial - ঘরে বসে সিরিয়াল নিন</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Hind Siliguri,Arial,sans-serif}
body{background:#fff7ed;padding:12px;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.logo{font-size:28px;font-weight:900;color:#111}
.logo span{color:#16a34a}
.sub{font-size:13px;color:#666;margin:2px 0 10px}
.live{background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.live b{color:#fbbf24}
.searchBox{display:flex;gap:8px;background:#fff;border:1px solid #eee;padding:10px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #00000010}
.searchBox input{flex:1;border:0;outline:0;font-size:15px}
.searchBox button{background:#0ea5e9;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:700}
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.filter button{white-space:nowrap;border:1px solid #e5e7eb;background:#fff;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.filter button.active{background:#0284c7;color:#fff;border-color:#0284c7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #00000012;border:1px solid #f1f1f1}
.card img{width:100%;height:220px;object-fit:cover}
.card-body{padding:12px}
.badge{color:#16a34a;font-size:12px;font-weight:700}
.name{font-size:20px;font-weight:900;margin:3px 0}
.spec{color:#666;font-size:14px}
.time{font-size:13px;color:#444;margin:6px 0}
.price{color:#16a34a;font-size:20px;font-weight:900}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.serialBtn{background:#16a34a;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
.delBtn{background:#fee2e2;color:#dc2626;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;display:none}
.adminMode .delBtn{display:inline-block}
.adminMode .addArea{display:block!important}
.addArea{display:none!important;background:#fff;padding:14px;border-radius:14px;margin-top:14px;border:2px dashed #0284c7}
.addArea input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:10px}
.addArea button{background:#0284c7;color:#fff;border:0;padding:11px;border-radius:10px;width:100%;font-weight:800}
.footer{text-align:center;margin-top:30px;color:#999;font-size:12px}
.footer a{color:#999;text-decoration:none}
</style>
</head>
<body>

<div class="top">
<div class="logo">Doctor <span>Serial</span></div>
<div style="font-size:12px;color:#888">চট্টগ্রাম • ফ্রি সার্ভিস</div>
</div>
<p class="sub">ঘরে বসে ডাক্তারের সিরিয়াল নিন - ফ্রি, কোনো লাইনে দাঁড়াতে হবে না</p>

<div class="live"><span>🔴 LIVE - এখন সিরিয়াল চলতেছে</span><span>মোট সিরিয়াল: <b id="count">0</b> জন ডাক্তার</span></div>

<div class="searchBox">
<input id="search" placeholder="ডাক্তারের নাম বা রোগ লিখুন... যেমন: জ্বর, গাইনী, শিশু" oninput="render()">
<button onclick="render()">খুঁজুন</button>
</div>

<div class="filter" id="filters"></div>
<div class="grid" id="grid"></div>

<div class="addArea" id="addArea">

<input id="nTime" placeholder="সময় - যেমন: সকাল ১০টা - দুপুর ১টা">

<button onclick="logoutAdmin()" style="background:#ef4444;margin-top:6px">Admin থেকে বের হোন</button>
</div>
